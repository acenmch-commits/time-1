name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Web Dir
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            echo "<h1>Time Tracker</h1><p>Please upload index.html to www folder</p>" > www/index.html
          fi

      - name: Install deps
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Set 64-bit only
        run: |
          sed -i "/defaultConfig {/a\\        ndk { abiFilters 'arm64-v8a' }" android/app/build.gradle

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
