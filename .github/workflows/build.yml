name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Clean
        run: rm -rf node_modules android

      - name: Prepare Web Dir
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            echo "<h1>Time Tracker</h1>" > www/index.html
          fi
          cp index.html www/index.html

      - name: Install deps
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Prepare notification sound
        run: |
          mkdir -p android/app/src/main/res/raw
          cp notification.wav android/app/src/main/res/raw/notification.wav

      - name: Add Android notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          s = path.read_text(encoding='utf-8')
          perms = [
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.SCHEDULE_EXACT_ALARM'
          ]
          for perm in perms:
              line = f'    <uses-permission android:name="{perm}" />\n'
              if perm not in s:
                  pos = s.find('>', s.find('<manifest')) + 1
                  s = s[:pos] + '\n' + line + s[pos:]
          path.write_text(s, encoding='utf-8')
          PY

      - name: Set 64-bit only
        run: |
          sed -i "/defaultConfig {/a\\        ndk { abiFilters 'arm64-v8a' }" android/app/build.gradle

      - name: Set version code from run number
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Decode keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          ls -la android/app/release.keystore

      - name: Inject signing config
        run: |
          python3 - <<'PY'
          path = 'android/app/build.gradle'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword '123456'
                      keyAlias 'timetracker'
                      keyPassword '123456'
                  }
              }
          """

          idx = content.find('android {')
          if idx < 0:
              raise SystemExit('android block not found')
          insert_at = content.find('\n', idx) + 1
          content = content[:insert_at] + signing_block + content[insert_at:]

          content = content.replace(
              'release {\n            minifyEnabled',
              "release {\n            signingConfig signingConfigs.release\n            minifyEnabled"
          )

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          print('signing config injected')
          PY

      - name: Sync
        run: npx cap sync android

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
